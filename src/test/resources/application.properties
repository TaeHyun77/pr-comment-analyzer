# 테스트 전용 오버라이드 — 메인 application.yml과 함께 로드되며 동일 키는 이 파일이 우선
# @SpringBootTest가 MySQL 없이 뜨도록 인메모리 H2를 사용
spring.datasource.url=jdbc:h2:mem:automation;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# RequiredEnvValidator 통과용 더미 값
github.token=test-token
github.login=test-user
github.webhook-secret=test-secret
llm.api-key=test-key
slack.enabled=false

# 기본값 없는 env 필수 설정의 테스트 더미 — 셸 환경변수 없이도 컨텍스트가 뜨게 함
github.repos=test-user/repo
slack.webhook-url=http://localhost/dummy
llm.base-url=http://localhost
llm.model=test-model
llm.max-tokens=1024
llm.temperature=0.0
llm.read-timeout-ms=1000
llm.max-attempts=1
pr-analyzer.enabled=false
pr-analyzer.include-own-comments=false
pr-analyzer.max-tool-iterations=3
pr-analyzer.max-files=3
pr-analyzer.max-file-chars=1000
pr-analyzer.max-dir-entries=10
pr-review.enabled=false
pr-review.max-files=10
pr-review.max-patch-chars=1000
pr-review.post-to-slack=false

# 컨텍스트 테스트 중 GitHub API 호출(부팅 복구 훅) 차단
github.webhook-recovery.enabled=false
