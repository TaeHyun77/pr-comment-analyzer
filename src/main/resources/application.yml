spring:
  application:
    name: automation
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

github:
  token: ${GITHUB_TOKEN:}
  login: ${GITHUB_LOGIN:}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  repos: ${GITHUB_REPOS:}
  webhook-recovery:
    enabled: ${GITHUB_WEBHOOK_RECOVERY_ENABLED:true}
    lookback-hours: ${GITHUB_WEBHOOK_RECOVERY_LOOKBACK_HOURS:24}
    state-file: ${GITHUB_WEBHOOK_RECOVERY_STATE_FILE:./pr-analyzer-deliveries.json}
    scheduler-enabled: ${GITHUB_WEBHOOK_RECOVERY_SCHEDULER_ENABLED:true}
    scheduler-interval-ms: ${GITHUB_WEBHOOK_RECOVERY_SCHEDULER_INTERVAL_MS:1800000}
    scheduler-lookback-hours: ${GITHUB_WEBHOOK_RECOVERY_SCHEDULER_LOOKBACK_HOURS:1}

groq:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  model: ${LLM_MODEL:llama-3.3-70b-versatile}
  max-tokens: ${LLM_MAX_TOKENS:2048}
  temperature: ${LLM_TEMPERATURE:0.3}
  read-timeout-ms: ${LLM_READ_TIMEOUT_MS:60000}
  max-attempts: ${LLM_MAX_ATTEMPTS:3}

slack:
  enabled: ${SLACK_ENABLED:true}
  webhook-url: ${SLACK_WEBHOOK_URL:}

pr-analyzer:
  enabled: ${PR_ANALYZER_ENABLED:true}
  include-own-comments: ${PR_ANALYZER_INCLUDE_OWN_COMMENTS:true}
  state-file: ${PR_ANALYZER_STATE_FILE:./pr-analyzer-state.json}
  max-tool-iterations: ${PR_ANALYZER_MAX_TOOL_ITERATIONS:8}
  max-files: ${PR_ANALYZER_MAX_FILES:6}
  max-file-chars: ${PR_ANALYZER_MAX_FILE_CHARS:25000}
  max-dir-entries: ${PR_ANALYZER_MAX_DIR_ENTRIES:100}

pr-review:
  enabled: ${PR_REVIEW_ENABLED:true}
  state-file: ${PR_REVIEW_STATE_FILE:./pr-analyzer-review-state.json}
  max-files: ${PR_REVIEW_MAX_FILES:50}
  max-patch-chars: ${PR_REVIEW_MAX_PATCH_CHARS:6000}
  post-to-slack: ${PR_REVIEW_POST_TO_SLACK:false}

logging:
  level:
    com.pr.automation: ${LOGGING_LEVEL_COM_PR_AUTOMATION:DEBUG}
