spring:
  application:
    name: automation
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/automation?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:automation}
    password: ${DB_PASSWORD:automation}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

github:
  token: ${GITHUB_TOKEN}
  login: ${GITHUB_LOGIN}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET}
  repos: ${GITHUB_REPOS}
  fetch-max-attempts: ${GITHUB_FETCH_MAX_ATTEMPTS}
  read-timeout-ms: ${GITHUB_READ_TIMEOUT_MS}

claude-cli:
  timeout-ms: ${CLAUDE_CLI_TIMEOUT_MS:120000}
  max-attempts: ${CLAUDE_CLI_MAX_ATTEMPTS:3}
  model: ${CLAUDE_CLI_MODEL:sonnet}
  effort: ${CLAUDE_CLI_EFFORT:high}
  # 네이티브 도구 모드 전용 - 읽기 전용 도구만 허용하고 비용으로 상한을 건다
  allowed-tools: ${CLAUDE_CLI_ALLOWED_TOOLS:Read Grep Glob}
  max-budget-usd: ${CLAUDE_CLI_MAX_BUDGET_USD:0.5}

slack:
  enabled: ${SLACK_ENABLED}
  webhook-url: ${SLACK_WEBHOOK_URL}
  max-attempts: ${SLACK_MAX_ATTEMPTS}
  read-timeout-ms: ${SLACK_READ_TIMEOUT_MS}

comment-analyzer:
  enabled: ${COMMENT_ANALYZER_ENABLED}
  include-own-comments: ${COMMENT_ANALYZER_INCLUDE_OWN_COMMENTS}
  max-file-chars: ${COMMENT_ANALYZER_MAX_FILE_CHARS:25000}
  notify-retry-delay-minutes: ${COMMENT_ANALYZER_NOTIFY_RETRY_DELAY_MINUTES}
  retry-max-attempts: ${COMMENT_ANALYZER_RETRY_MAX_ATTEMPTS:3}
  retry-batch-size: ${COMMENT_ANALYZER_RETRY_BATCH_SIZE:20}
  # 재시도 주기. FAILED에는 별도 백오프가 없어 이 값이 곧 재시도 간격이 된다
  retry-interval-ms: ${COMMENT_ANALYZER_RETRY_INTERVAL_MS:300000}

pr-review:
  enabled: ${PR_REVIEW_ENABLED}
  max-files: ${PR_REVIEW_MAX_FILES}
  max-patch-chars: ${PR_REVIEW_MAX_PATCH_CHARS}
  post-to-slack: ${PR_REVIEW_POST_TO_SLACK}

logging:
  level:
    com.pr.automation: ${LOGGING_LEVEL_COM_PR_AUTOMATION:DEBUG}
